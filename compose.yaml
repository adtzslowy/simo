services:
  postgres:
    image: postgres:17
    container_name: postgresql

    environment:
      POSTGRES_DB: simo_database
      POSTGRES_USER: simo
      POSTGRES_PASSWORD: simo

    ports:
      - "5432:5432"

    volumes:
      - simo-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  simo-postgres-data:
